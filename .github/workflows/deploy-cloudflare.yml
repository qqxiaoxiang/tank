name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site
        run: npm run build
        env:
          SITE_URL: https://manurefermentationtank.com
          BASE_PATH: /
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
